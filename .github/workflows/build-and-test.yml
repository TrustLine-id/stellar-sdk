# Builds and tests from a clean checkout. This mirrors exactly what a reviewer gets
# when they clone the repository and follow the README, which is the only environment
# that matters. This workspace has no path dependencies, so it must stay self-contained:
# do not add a checkout of a sibling repository or a local cargo override here.

name: build-and-test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  STELLAR_CLI_VERSION: "27.1.0"

jobs:
  clean-clone:
    name: Clean clone build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with the Soroban wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Install Stellar CLI
        run: |
          curl -sSfL \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin stellar
          stellar --version

      - name: Build contracts
        run: stellar contract build

      - name: Run tests
        run: cargo test --workspace
