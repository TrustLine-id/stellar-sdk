[workspace]
resolver = "2"
members = [
  "crates/*",
  "contracts/*",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Trustline Digital Asset Ltd. <contact@trustline.id>"]
repository = "https://github.com/TrustLine-id/stellar-sdk"

[workspace.dependencies]
soroban-sdk = "27"
trustline-sdk = { path = "crates/trustline-sdk" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
